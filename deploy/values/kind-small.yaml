# kind-small — kind/k3d with the heavy components trimmed out so the stack fits
# a modest laptop. Keeps the control plane + object/search path; disables the
# streaming/analytics/observability extras. Enable a component again with
# `--set components.<name>.enabled=true` when you need it.
global:
  environment: kind-small
  defaultReplicas: 1
  defaultResources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  oidc:
    issuer: http://127.0.0.1:18083/realms/ontoaxis
    audience: ontoaxis-api
    jwksUrl: http://keycloak.oa-system.svc.cluster.local:8080/realms/ontoaxis/protocol/openid-connect/certs
  secretStore:
    name: ontoaxis-kind
    kind: ClusterSecretStore

components:
  # Same wave -5 Secret owners as kind; charts only reference their targets.
  postgres:
    externalSecret: {enabled: false}
  keycloak:
    externalSecret: {enabled: false}
  openfga:
    externalSecret: {enabled: false}
  seaweedfs:
    externalSecret: {enabled: false}
  ontoaxis-core:
    externalSecret: {enabled: false}
  # Streaming / CDC / analytics / catalog engines trimmed for small clusters.
  kafka:
    enabled: false
  debezium:
    enabled: false
  apicurio:
    enabled: false
  kestra:
    enabled: false
  temporal:
    enabled: false
  trino:
    enabled: false
    externalSecret: {enabled: false}
  nessie:
    enabled: false
  # Observability extras that are not needed for a functional local stack.
  jaeger:
    enabled: false
  perses:
    enabled: false
backup:
  externalSecret: {enabled: false}
