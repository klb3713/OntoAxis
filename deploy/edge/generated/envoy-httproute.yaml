apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
    annotations:
        ontoaxis.dev/route-table-sha256: df684c65978058c8cdae20b7cc5388b706fc329b7a6a9a196a09af6aa1fe07f9
    name: oa-edge-forward-auth
spec:
    extAuth:
        http:
            backendRefs:
                - name: ontoaxis-core
                  port: 8080
            headersToBackend:
                - x-ontoaxis-tenant-id
                - x-ontoaxis-user-id
                - x-ontoaxis-org-ids
                - x-ontoaxis-workspace-ids
                - x-ontoaxis-roles
                - x-ontoaxis-request-id
            path: /internal/edge-auth
    targetRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: oa-edge-protected
---
apiVersion: gateway.envoyproxy.io/v1alpha1
