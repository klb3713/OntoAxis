        - name: oa-edge
    rules:
        - backendRefs:
            - name: ontoaxis-core
              namespace: oa-app
              port: 8080
          filters:
            - requestHeaderModifier:
                remove:
                    - Authorization
              type: RequestHeaderModifier
          matches:
