---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
    annotations:
        ontoaxis.dev/route-table-sha256: 8fb953d6aecd054fcdd9b6cfe1ea2222366553b82d4d19d1799cb5e1c4a33279
    name: oa-edge-forward-auth
    namespace: oa-system
spec:
    extAuth:
        http:
            backendRefs:
                - name: ontoaxis-core
                  namespace: oa-app
                  port: 8080
            headersToBackend:
                - x-ontoaxis-tenant-id
                - x-ontoaxis-user-id
                - x-ontoaxis-org-ids
                - x-ontoaxis-workspace-ids
                - x-ontoaxis-roles
                - x-ontoaxis-request-id
            path: /internal/edge-auth
    targetRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: oa-edge-protected
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
    annotations:
        ontoaxis.dev/route-table-sha256: 8fb953d6aecd054fcdd9b6cfe1ea2222366553b82d4d19d1799cb5e1c4a33279
    name: oa-edge-rate-limit
    namespace: oa-system
spec:
    rateLimit:
        local:
            rules:
                - limit:
                    requests: 50
                    unit: Second
        type: Local
    targetRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: oa-edge-protected
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
    annotations:
        ontoaxis.dev/route-table-sha256: 8fb953d6aecd054fcdd9b6cfe1ea2222366553b82d4d19d1799cb5e1c4a33279
    name: oa-edge-method-not-allowed
    namespace: oa-system
spec:
    directResponse:
        body:
            inline: '{"error":{"code":"method_not_allowed","message":"method not allowed"}}'
            type: Inline
        contentType: application/json
        statusCode: 405
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
    annotations:
        ontoaxis.dev/route-table-sha256: 8fb953d6aecd054fcdd9b6cfe1ea2222366553b82d4d19d1799cb5e1c4a33279
    name: oa-edge-to-oa-app
    namespace: oa-app
spec:
    from:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          namespace: oa-system
        - group: gateway.envoyproxy.io
          kind: SecurityPolicy
          namespace: oa-system
    to:
        - group: ""
          kind: Service
          name: ontoaxis-core
        - group: ""
          kind: Service
          name: web
