              path:
                type: PathPrefix
                value: /api/v1/ingestion
            - method: POST
              path:
                type: PathPrefix
                value: /api/v1/ingestion
        - backendRefs:
            - name: ontoaxis-core
              namespace: oa-app
              port: 8080
          filters:
            - requestHeaderModifier:
                remove:
                    - Authorization
              type: RequestHeaderModifier
          matches:
