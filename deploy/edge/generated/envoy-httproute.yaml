                value: /api/v1/datasets
            - method: DELETE
              path:
                type: PathPrefix
                value: /api/v1/datasets
        - backendRefs:
            - name: ontoaxis-core
              namespace: oa-app
              port: 8080
          filters:
            - requestHeaderModifier:
                remove:
                    - Authorization
              type: RequestHeaderModifier
          matches:
            - method: GET
              path:
                type: PathPrefix
                value: /api/v1/connectors
            - method: POST
              path:
                type: PathPrefix
                value: /api/v1/connectors
            - method: PATCH
