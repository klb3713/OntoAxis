---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
    annotations:
        ontoaxis.dev/route-table-sha256: df684c65978058c8cdae20b7cc5388b706fc329b7a6a9a196a09af6aa1fe07f9
    name: oa-edge
spec:
    gatewayClassName: eg
    listeners:
        - name: http
          port: 8080
          protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    annotations:
        ontoaxis.dev/route-table-sha256: df684c65978058c8cdae20b7cc5388b706fc329b7a6a9a196a09af6aa1fe07f9
    name: oa-edge-public
spec:
    parentRefs:
        - name: oa-edge
    rules:
        - backendRefs:
            - name: ontoaxis-core
              port: 8080
          matches:
            - path:
                type: Exact
                value: /healthz
        - backendRefs:
            - name: ontoaxis-core
              port: 8080
          matches:
            - path:
                type: Exact
                value: /readyz
        - backendRefs:
            - name: ontoaxis-core
              port: 8080
          matches:
            - path:
                type: PathPrefix
                value: /.well-known/
