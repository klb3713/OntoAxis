---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
    annotations:
        ontoaxis.dev/route-table-sha256: 8fb953d6aecd054fcdd9b6cfe1ea2222366553b82d4d19d1799cb5e1c4a33279
    name: oa-edge
    namespace: oa-system
spec:
    gatewayClassName: eg
    listeners:
        - name: http
          port: 8080
          protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    annotations:
        ontoaxis.dev/route-table-sha256: 8fb953d6aecd054fcdd9b6cfe1ea2222366553b82d4d19d1799cb5e1c4a33279
    name: oa-edge-public
    namespace: oa-system
spec:
    parentRefs:
        - name: oa-edge
    rules:
        - backendRefs:
            - name: ontoaxis-core
              namespace: oa-app
              port: 8080
          matches:
            - path:
                type: Exact
                value: /healthz
        - backendRefs:
            - name: ontoaxis-core
              namespace: oa-app
              port: 8080
          matches:
            - path:
                type: Exact
                value: /readyz
        - backendRefs:
            - name: ontoaxis-core
              namespace: oa-app
              port: 8080
          matches:
            - path:
                type: PathPrefix
                value: /.well-known/
        - backendRefs:
            - name: web
              namespace: oa-app
              port: 80
          matches:
            - path:
                type: Exact
                value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    annotations:
        ontoaxis.dev/route-table-sha256: 8fb953d6aecd054fcdd9b6cfe1ea2222366553b82d4d19d1799cb5e1c4a33279
