# 依赖版本策略：单一真源。
#
# 这里手写「必须是什么」，具体「现在是什么」由 `make deps-lock` 写入 lock.yaml。
# `make deps-check` 离线校验两者一致，并检查 latest 禁令、策略覆盖、例外到期与 digest 棘轮。
#
# tier:
#   p0  平台底座，EOL 前 90 天必须升级，升级走 OpenSpec change
#   p1  运行时/构建链，跟随 LTS，minor 可走 Fast Track
#   p2  应用库/自有镜像，按 semver 或提交推进
# owner: 负责评审升级的 change 或团队，不写个人
# review_by: 下次必须复核的日期
# eol_source: endoflife.date 的 slug，audit 据此查 EOL
# support_until: 上游支持截止（已知时填写）

schema: 1
digest_required_from: 2027-01-31

defaults:
  tier: p1
  owner: production-delivery
  review_by: 2027-03-31

