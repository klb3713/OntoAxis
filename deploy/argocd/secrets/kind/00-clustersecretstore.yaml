# ClusterSecretStore for kind.
#
# Uses the ESO `kubernetes` provider to read the git-ignored bootstrap Secret
# `ontoaxis-bootstrap` living in the `external-secrets` namespace. The Secret is
# created by scripts/delivery-secrets-bootstrap.sh from `.env.kind` (never
# committed). This store makes the repository zero-plaintext-secret: Git only
# carries the reference below, not any value.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: ontoaxis-kind
  labels:
    app.kubernetes.io/part-of: ontoaxis
    ontoaxis.io/environment: kind
spec:
  provider:
    kubernetes:
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
      remoteNamespace: external-secrets
