# ExternalSecret references for kind. Values live only in the git-ignored
# bootstrap Secret `ontoaxis-bootstrap`; Git carries names/references only.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ontoaxis-core
  namespace: oa-app
  labels:
    app.kubernetes.io/part-of: ontoaxis
    ontoaxis.io/environment: kind
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ontoaxis-kind
    kind: ClusterSecretStore
  target:
    name: ontoaxis-core-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef: {key: ontoaxis-bootstrap, property: database-url}
    - secretKey: oidc-client-secret
      remoteRef: {key: ontoaxis-bootstrap, property: oidc-client-secret}
    - secretKey: meilisearch-master-key
      remoteRef: {key: ontoaxis-bootstrap, property: meilisearch-master-key}
---
