# ExternalSecret references for prod-like (TEMPLATE ONLY — NOT CONNECTED).
#
# remoteRef.key uses the logical path convention `ontoaxis/prod-like/<component>/<key>`
# expected of an external KV provider. These manifests are rendered/reviewed but
# never synced against a live provider in Stage 2 (`not executed`).
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ontoaxis-core
  namespace: oa-app
  labels:
    app.kubernetes.io/part-of: ontoaxis
    ontoaxis.io/environment: prod-like
  annotations:
    ontoaxis.io/connection: "not-executed"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ontoaxis-prod-like
    kind: ClusterSecretStore
  target:
    name: ontoaxis-core-secrets
    creationPolicy: Owner
  data:
    - secretKey: ONTOAXIS_DATABASE_URL
      remoteRef:
        key: ontoaxis/prod-like/core/database-url
    - secretKey: ONTOAXIS_OIDC_CLIENT_SECRET
      remoteRef:
        key: ontoaxis/prod-like/core/oidc-client-secret
    - secretKey: ONTOAXIS_MEILISEARCH_MASTER_KEY
      remoteRef:
        key: ontoaxis/prod-like/core/meilisearch-master-key
---
