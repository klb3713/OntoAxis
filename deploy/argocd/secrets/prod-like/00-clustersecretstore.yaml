# ClusterSecretStore for prod-like (TEMPLATE ONLY — NOT CONNECTED).
#
# Stage 2 never connects to a real external secret provider. This store declares
# the intended `vault` KV-v2 shape with an intentionally unreachable server and a
# placeholder auth role so that:
#   1. the manifest is rendered and reviewed for shape only, and
#   2. an accidental sync fails closed (cannot reach vault.invalid) instead of
#      silently falling back to a default password.
#
# Evidence for this path is marked `not executed` in the delivery evidence.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: ontoaxis-prod-like
  labels:
    app.kubernetes.io/part-of: ontoaxis
    ontoaxis.io/environment: prod-like
  annotations:
    ontoaxis.io/connection: "not-executed"
spec:
  provider:
    vault:
      server: https://vault.invalid
      path: ontoaxis/prod-like
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ontoaxis-prod-like
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
