# ClusterSecretStore for staging-like.
#
# Same kubernetes-provider pattern as kind: reads the `ontoaxis-bootstrap` Secret
# from `external-secrets`, which is populated from environment variables or a
# git-ignored .env file. staging-like still never stores values in Git.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: ontoaxis-staging-like
  labels:
    app.kubernetes.io/part-of: ontoaxis
    ontoaxis.io/environment: staging-like
spec:
  provider:
    kubernetes:
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
      remoteNamespace: external-secrets
