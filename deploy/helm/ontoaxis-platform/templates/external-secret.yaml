{{- range $name, $c := .Values.components }}
{{- if and $c.enabled (eq $c.chart $.Chart.Name) }}
{{- if and $c.externalSecret $c.externalSecret.enabled }}
{{- $store := $c.externalSecret.secretStoreRef | default $.Values.global.secretStore }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $c.externalSecret.name | default (printf "%s-external-secret" $name) }}
  namespace: {{ $c.namespace | default $.Values.global.namespace | default "oa-app" }}
  labels:
    {{- include "ontoaxis.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  refreshInterval: {{ $c.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required (printf "ontoaxis: %s externalSecret.secretStoreRef.name is required" $name) $store.name }}
    kind: {{ $store.kind | default "ClusterSecretStore" }}
  target:
    name: {{ required (printf "ontoaxis: %s externalSecret.targetName is required" $name) $c.externalSecret.targetName }}
    creationPolicy: {{ $c.externalSecret.creationPolicy | default "Owner" }}
  data:
    {{- range $c.externalSecret.data }}
    - secretKey: {{ required (printf "ontoaxis: %s externalSecret.data[].secretKey is required" $name) .secretKey }}
      remoteRef:
        {{- if .remoteRef.fullKey }}
        key: {{ required (printf "ontoaxis: %s externalSecret remoteRef.key is required" $name) .remoteRef.key }}
        {{- else }}
        key: {{ printf "ontoaxis/%s/%s" $.Values.global.environment (required (printf "ontoaxis: %s externalSecret remoteRef.key is required" $name) .remoteRef.key) }}
        {{- end }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
