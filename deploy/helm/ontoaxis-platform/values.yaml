# ontoaxis-platform default values.
# NOTE: environment-specific overrides live in deploy/values/*.yaml and are
# applied on top of this file (see deploy/helm/README.md).
#
# Image digests below are deterministic PLACEHOLDERS (sha256 + 64 hex). They
# must be replaced by real release-manifest digests before any real deployment.

global:
  environment: kind
  defaultReplicas: 1
  imagePullPolicy: IfNotPresent
  defaultResources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  oidc:
    issuer: http://localhost:18083/realms/ontoaxis
    audience: ontoaxis-api
    jwksUrl: ""
  secretStore:
    name: ontoaxis-kubernetes-store
    kind: ClusterSecretStore

# Namespaces are created by the platform chart only (never by app/data/observability).
createNamespaces: true
namespaces:
  - name: oa-system
    syncWave: "-10"
  - name: oa-app
    syncWave: "-10"
  - name: oa-data
    syncWave: "-10"
  - name: oa-observability
    syncWave: "-10"

components:
  postgres:
    chart: ontoaxis-platform
    enabled: true
    namespace: oa-data
    image:
      repository: docker.io/library/postgres
      digest: sha256:c33545010eb5f1b23e8d7a529f5436d93e933b85c999e6d274ce4102dc538106
    ports:
      - name: tcp
        containerPort: 5432
    env:
      - name: POSTGRES_DB
        value: ontoaxis
      - name: POSTGRES_USER
        value: ontoaxis
    secretRefs:
      - name: POSTGRES_PASSWORD
        secretName: ontoaxis-data-secrets
        key: postgres-password
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: tcp
          port: 5432
          targetPort: tcp
    probes:
      mode: tcp
      port: tcp
    terminationGracePeriodSeconds: 60
    pdb:
      enabled: true
      minAvailable: 1
    externalSecret:
      enabled: true
      name: ontoaxis-data-db-external-secret
      targetName: ontoaxis-data-secrets
      data:
        - secretKey: postgres-password
          remoteRef:
            key: data/postgres-password
            property: password

  keycloak:
    chart: ontoaxis-platform
    enabled: true
    namespace: oa-system
    image:
      repository: quay.io/keycloak/keycloak
      digest: sha256:4141bb80f2680f54e6d7b012f489875f09668d6f3f02d54258a50d2efb955663
    ports:
      - name: http
        containerPort: 8080
    env:
      - name: KC_HTTP_ENABLED
        value: "true"
      - name: KC_FEATURES
        value: organization
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
    secretRefs:
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        secretName: ontoaxis-keycloak-secrets
        key: admin-password
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: http
          port: 8080
          targetPort: http
    probes:
      mode: http
      path: /healthz
      readyPath: /readyz
      port: http
    terminationGracePeriodSeconds: 60
    pdb:
      enabled: true
      minAvailable: 1
    externalSecret:
      enabled: true
      name: ontoaxis-keycloak-external-secret
      targetName: ontoaxis-keycloak-secrets
      data:
        - secretKey: admin-password
          remoteRef:
            key: keycloak/admin-password
            property: password
        - secretKey: oidc-client-secret
          remoteRef:
            key: keycloak/oidc-client-secret
            property: client-secret

  openfga:
    chart: ontoaxis-platform
    enabled: true
    namespace: oa-system
    image:
      repository: openfga/openfga
      digest: sha256:da8fd1f33609a4c1564e03f544c6647f3808530c65280f8610d49442c7742473
    ports:
      - name: http
        containerPort: 8080
      - name: grpc
        containerPort: 8081
    env:
      - name: OPENFGA_DATASTORE_ENGINE
        value: postgres
      - name: OPENFGA_AUTHN_METHOD
        value: preshared
    secretRefs:
      - name: OPENFGA_DATASTORE_URI
        secretName: ontoaxis-openfga-secrets
        key: datastore-uri
      - name: OPENFGA_AUTHN_PRESHARED_KEYS
        secretName: ontoaxis-openfga-secrets
        key: preshared-key
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: http
          port: 8080
          targetPort: http
        - name: grpc
          port: 8081
          targetPort: grpc
    probes:
      mode: http
      path: /healthz
      readyPath: /readyz
      port: http
    terminationGracePeriodSeconds: 30
    pdb:
      enabled: true
      minAvailable: 1
    externalSecret:
      enabled: true
      name: ontoaxis-openfga-external-secret
      targetName: ontoaxis-openfga-secrets
      data:
        - secretKey: datastore-uri
          remoteRef:
            key: openfga/datastore-uri
            property: uri
        - secretKey: preshared-key
          remoteRef:
            key: openfga/preshared-key
            property: key

  valkey:
    chart: ontoaxis-platform
    enabled: true
    namespace: oa-app
    image:
      repository: docker.io/valkey/valkey
      digest: sha256:ba84b1f8691d7216992433291e42f7c6e60a1fde971da211e66ce5ef821a0690
    ports:
      - name: tcp
        containerPort: 6379
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: tcp
          port: 6379
          targetPort: tcp
    probes:
      mode: tcp
      port: tcp
    terminationGracePeriodSeconds: 30
    pdb:
      enabled: true
      minAvailable: 1

  seaweedfs:
    chart: ontoaxis-platform
    enabled: true
    namespace: oa-app
    image:
      repository: docker.io/chrislusf/seaweedfs
      digest: sha256:a2e154a654507f3abdb52d96a9bc650228555bc63afda0a29b45dfa86f7d2ff1
    ports:
      - name: http
        containerPort: 8333
      - name: master
        containerPort: 9333
    secretRefs:
      - name: WEED_S3_ACCESS_KEY_ID
        secretName: ontoaxis-data-secrets
        key: s3-access-key
      - name: WEED_S3_SECRET_ACCESS_KEY
        secretName: ontoaxis-data-secrets
        key: s3-secret-key
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: http
          port: 8333
          targetPort: http
        - name: master
          port: 9333
          targetPort: master
    probes:
      mode: http
      path: /healthz
      readyPath: /readyz
      port: http
    terminationGracePeriodSeconds: 30
    pdb:
      enabled: true
      minAvailable: 1
    externalSecret:
      enabled: true
      name: ontoaxis-data-s3-external-secret
      targetName: ontoaxis-data-secrets
      data:
        - secretKey: s3-access-key
          remoteRef:
            key: data/s3-access-key
            property: access-key
        - secretKey: s3-secret-key
          remoteRef:
            key: data/s3-secret-key
            property: secret-key
