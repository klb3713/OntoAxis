{{- if and .Values.backup.enabled .Values.backup.externalSecret.enabled }}
{{- $store := .Values.global.secretStore }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.backup.externalSecret.name | default (printf "%s-external-secret" .Values.backup.name) }}
  namespace: {{ .Values.backup.namespace }}
  labels:
    {{- include "ontoaxis.labels" (dict "name" "backup" "root" $) | nindent 4 }}
spec:
  refreshInterval: {{ .Values.backup.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "ontoaxis-jobs: global.secretStore.name is required" $store.name }}
    kind: {{ $store.kind | default "ClusterSecretStore" }}
  target:
    name: {{ required "ontoaxis-jobs: backup.externalSecret.targetName is required" .Values.backup.externalSecret.targetName }}
    creationPolicy: Owner
  data:
    {{- range .Values.backup.externalSecret.data }}
    - secretKey: {{ required "ontoaxis-jobs: externalSecret.data[].secretKey is required" .secretKey }}
      remoteRef:
        {{- if .remoteRef.fullKey }}
        key: {{ required "ontoaxis-jobs: externalSecret remoteRef.key is required" .remoteRef.key }}
        {{- else }}
        key: {{ printf "ontoaxis/%s/%s" $.Values.global.environment (required "ontoaxis-jobs: externalSecret remoteRef.key is required" .remoteRef.key) }}
        {{- end }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property }}
        {{- end }}
    {{- end }}
{{- end }}
