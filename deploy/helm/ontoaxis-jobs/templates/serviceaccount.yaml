{{- if and .Values.backup.enabled .Values.backup.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.backup.serviceAccount.name | default "ontoaxis-backup" }}
  namespace: {{ .Values.backup.namespace }}
  labels:
    {{- include "ontoaxis.labels" (dict "name" "backup" "root" $) | nindent 4 }}
{{- end }}
