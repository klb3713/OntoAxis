name: ontoaxis-pipeline
services:
  kestra:
    build:
      context: .
      dockerfile: Dockerfile
    command: server local
    environment:
      KESTRA_CONFIGURATION: |
        kestra:
          server:
            basic-auth:
              enabled: false
          repository:
            type: memory
          queue:
            type: memory
          storage:
            type: local
            local:
              base-path: /tmp/kestra-storage
          tasks:
            tmp-dir:
              enabled: true
              path: /tmp/kestra-tmp
      DBT_TRINO_HOST: trino
      DBT_TRINO_PORT: "8080"
      DBT_TRINO_USER: ontoaxis
    ports:
      - "18086:8080"
    depends_on:
      trino:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/configs"]
      interval: 10s
      timeout: 5s
      retries: 30
  ontoaxis-core:
    environment:
      ONTOAXIS_KESTRA_URL: http://kestra:8080
      ONTOAXIS_KESTRA_TIMEOUT: 30s
      ONTOAXIS_PIPELINE_DBT_CATALOG: memory
      ONTOAXIS_PIPELINE_DBT_IMAGE: ontoaxis/pipeline-dbt:local
      ONTOAXIS_ENVIRONMENT: local
    depends_on:
      kestra:
        condition: service_healthy
