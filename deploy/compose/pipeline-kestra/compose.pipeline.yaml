name: ontoaxis-pipeline
services:
  kestra:
    build:
      context: ./pipeline-kestra
      dockerfile: Dockerfile
    command: server local
    environment:
      KESTRA_SERVER_BASIC_AUTH_ENABLED: "true"
      KESTRA_SERVER_BASIC_AUTH_USERNAME: ${KESTRA_BASIC_AUTH_USERNAME:?set KESTRA_BASIC_AUTH_USERNAME}
      # Kestra v2 (OSS) 固定要求：用户名必须是合法邮箱，口令为明文且≥8 位、
      # 含大小写字母与数字。这里仅用于本地/CI 合成环境。
      KESTRA_SERVER_BASIC_AUTH_PASSWORD: ${KESTRA_BASIC_AUTH_PASSWORD:?set KESTRA_BASIC_AUTH_PASSWORD}
      KESTRA_CONFIGURATION: |
        kestra:
          repository:
            type: memory
          queue:
            type: memory
          storage:
            type: local
            local:
              base-path: /tmp/kestra-storage
          tasks:
            tmp-dir:
              enabled: true
              path: /tmp/kestra-tmp
      DBT_TRINO_HOST: trino
      DBT_TRINO_USER: ontoaxis
    ports:
      - "18086:8080"
    depends_on:
      trino:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$${KESTRA_SERVER_BASIC_AUTH_USERNAME}:$${KESTRA_SERVER_BASIC_AUTH_PASSWORD}\" http://localhost:8080/api/v1/configs"]
      interval: 10s
      timeout: 5s
      retries: 30
  ontoaxis-core:
    environment:
      ONTOAXIS_KESTRA_URL: http://kestra:8080
      ONTOAXIS_KESTRA_TIMEOUT: 30s
      ONTOAXIS_KESTRA_API_TOKEN: "basic:${KESTRA_BASIC_AUTH_USERNAME}:${KESTRA_BASIC_AUTH_PASSWORD}"
      ONTOAXIS_PIPELINE_DBT_CATALOG: memory
      ONTOAXIS_PIPELINE_DBT_IMAGE: ontoaxis/pipeline-dbt:local
      ONTOAXIS_ENVIRONMENT: local
    depends_on:
      kestra:
        condition: service_healthy
