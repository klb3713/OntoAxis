name: ontoaxis-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ontoaxis
      POSTGRES_USER: ontoaxis
      POSTGRES_PASSWORD: ontoaxis
    ports:
      - "${ONTOAXIS_POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - ontoaxis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontoaxis -d ontoaxis"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:18083
      KC_HTTP_ENABLED: "true"
      KC_FEATURES: organization
    ports:
      - "${ONTOAXIS_KEYCLOAK_HOST_PORT:-18083}:8080"
    volumes:
      - ./keycloak/realm-ontoaxis.json:/opt/keycloak/data/import/realm.json:ro

  trino:
    image: trinodb/trino:latest
    ports:
      - "${ONTOAXIS_TRINO_HOST_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        VITE_API_MODE: http
        VITE_AUTH_MODE: oidc
        VITE_OIDC_AUTHORITY: http://localhost:18083/realms/ontoaxis
        VITE_OIDC_CLIENT_ID: ontoaxis-web
        VITE_OIDC_REDIRECT_URI: http://localhost:18082/auth/callback
    ports:
      - "${ONTOAXIS_WEB_HOST_PORT:-18082}:80"
    depends_on:
      ontoaxis-core:
        condition: service_healthy

  ontoaxis-core:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      ONTOAXIS_HTTP_ADDR: ":8080"
      ONTOAXIS_METRICS_ADDR: ":9090"
      ONTOAXIS_DATABASE_URL: "postgres://ontoaxis:ontoaxis@postgres:5432/ontoaxis?sslmode=disable"
      ONTOAXIS_LOG_LEVEL: "info"
      ONTOAXIS_SHUTDOWN_TIMEOUT: "10s"
      # Local compose has no oa-edge; trust the compose network boundary only.
      ONTOAXIS_TRUST_GATEWAY: "false"
      ONTOAXIS_OIDC_ISSUER: "http://localhost:18083/realms/ontoaxis"
      ONTOAXIS_OIDC_AUDIENCE: "ontoaxis-api"
      ONTOAXIS_OIDC_JWKS_URL: "http://keycloak:8080/realms/ontoaxis/protocol/openid-connect/certs"
      ONTOAXIS_TRINO_URL: "http://trino:8080"
    ports:
      - "${ONTOAXIS_CORE_HOST_PORT:-18080}:8080"
      - "${ONTOAXIS_METRICS_HOST_PORT:-19090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  ontoaxis_postgres_data:
