name: ontoaxis-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ontoaxis
      POSTGRES_USER: ontoaxis
      POSTGRES_PASSWORD: ontoaxis
    ports:
      - "${ONTOAXIS_POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - ontoaxis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontoaxis -d ontoaxis"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:18083
      KC_HTTP_ENABLED: "true"
      KC_FEATURES: organization
    ports:
      - "${ONTOAXIS_KEYCLOAK_HOST_PORT:-18083}:8080"
    volumes:
      - ./keycloak/realm-ontoaxis.json:/opt/keycloak/data/import/realm.json:ro

  trino:
    image: trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    ports:
      - "${ONTOAXIS_TRINO_HOST_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v1/info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        VITE_API_MODE: http
        VITE_AUTH_MODE: oidc
        VITE_OIDC_AUTHORITY: http://localhost:18083/realms/ontoaxis
        VITE_OIDC_CLIENT_ID: ontoaxis-web
        VITE_OIDC_REDIRECT_URI: http://localhost:18082/auth/callback
    ports:
      - "${ONTOAXIS_WEB_HOST_PORT:-18082}:80"
    depends_on:
      ontoaxis-core:
        condition: service_healthy

  ontoaxis-core:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      ONTOAXIS_HTTP_ADDR: ":8080"
      ONTOAXIS_METRICS_ADDR: ":9090"
      ONTOAXIS_DATABASE_URL: "postgres://ontoaxis:ontoaxis@postgres:5432/ontoaxis?sslmode=disable"
      ONTOAXIS_LOG_LEVEL: "info"
      ONTOAXIS_SHUTDOWN_TIMEOUT: "10s"
      # Local compose has no oa-edge; trust the compose network boundary only.
      ONTOAXIS_TRUST_GATEWAY: "false"
      ONTOAXIS_OIDC_ISSUER: "http://localhost:18083/realms/ontoaxis"
      ONTOAXIS_OIDC_AUDIENCE: "ontoaxis-api"
      ONTOAXIS_OIDC_JWKS_URL: "http://keycloak:8080/realms/ontoaxis/protocol/openid-connect/certs"
      ONTOAXIS_TRINO_URL: "http://trino:8080"
      ONTOAXIS_ENVIRONMENT: "local"
      ONTOAXIS_COMMIT: "${ONTOAXIS_COMMIT:-unknown}"
      ONTOAXIS_OTEL_EXPORTER_OTLP_ENDPOINT: "${ONTOAXIS_OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      ONTOAXIS_OTEL_SAMPLE_RATIO: "${ONTOAXIS_OTEL_SAMPLE_RATIO:-1.0}"
      ONTOAXIS_SEARCH_ENABLED: "true"
      ONTOAXIS_SEARCH_URL: "http://meilisearch:7700"
      ONTOAXIS_SEARCH_API_KEY: "local-search-master-key"
    ports:
      - "${ONTOAXIS_CORE_HOST_PORT:-18080}:8080"
      - "${ONTOAXIS_METRICS_HOST_PORT:-19090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      search-worker:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  meilisearch:
    profiles: ["search"]
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: local-search-master-key
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:17700:7700"
    volumes:
      - search_data:/meili_data

  search-worker:
    profiles: ["search"]
    build:
      context: ../..
      dockerfile: deploy/compose/search/Dockerfile
    command: ["consume"]
    environment:
      ONTOAXIS_DATABASE_URL: "postgres://ontoaxis:ontoaxis@postgres:5432/ontoaxis?sslmode=disable"
      ONTOAXIS_SEARCH_ENABLED: "true"
      ONTOAXIS_SEARCH_URL: "http://meilisearch:7700"
      ONTOAXIS_SEARCH_API_KEY: "local-search-master-key"
      ONTOAXIS_SEARCH_HTTP_ADDR: ":8081"
      ONTOAXIS_SEARCH_METRICS_ADDR: ":9094"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    ports:
      - "127.0.0.1:${ONTOAXIS_SEARCH_WORKER_PORT:-18088}:8081"
    restart: unless-stopped

  oa-edge:
    profiles: ["edge"]
    image: traefik:v3.3
    command:
      - --configFile=/etc/traefik/traefik.yaml
    ports:
      - "${ONTOAXIS_EDGE_HOST_PORT:-18085}:8080"
    volumes:
      - ../edge/traefik-static.yaml:/etc/traefik/traefik.yaml:ro
      - ../edge/generated/traefik-dynamic.yaml:/etc/traefik/dynamic/traefik-dynamic.yaml:ro
    networks:
      - edge
    depends_on:
      ontoaxis-core-edge:
        condition: service_healthy

  ontoaxis-core-edge:
    profiles: ["edge"]
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      ONTOAXIS_HTTP_ADDR: ":8080"
      ONTOAXIS_METRICS_ADDR: ":9090"
      ONTOAXIS_DATABASE_URL: "postgres://ontoaxis:ontoaxis@postgres:5432/ontoaxis?sslmode=disable"
      ONTOAXIS_LOG_LEVEL: "info"
      ONTOAXIS_SHUTDOWN_TIMEOUT: "10s"
      ONTOAXIS_TRUST_GATEWAY: "true"
      ONTOAXIS_OIDC_ISSUER: "http://localhost:18083/realms/ontoaxis"
      ONTOAXIS_OIDC_AUDIENCE: "ontoaxis-api"
      ONTOAXIS_OIDC_JWKS_URL: "http://keycloak:8080/realms/ontoaxis/protocol/openid-connect/certs"
      ONTOAXIS_TRINO_URL: "http://trino:8080"
      ONTOAXIS_ENVIRONMENT: "local"
      ONTOAXIS_COMMIT: "${ONTOAXIS_COMMIT:-unknown}"
      ONTOAXIS_OTEL_EXPORTER_OTLP_ENDPOINT: "${ONTOAXIS_OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      ONTOAXIS_OTEL_SAMPLE_RATIO: "${ONTOAXIS_OTEL_SAMPLE_RATIO:-1.0}"
    networks:
      default: {}
      edge:
        aliases:
          - ontoaxis-core
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      ontoaxis-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${ONTOAXIS_OTEL_GRPC_HOST_PORT:-14317}:4317"
      - "${ONTOAXIS_OTEL_HTTP_HOST_PORT:-14318}:4318"
      - "${ONTOAXIS_OTEL_METRICS_HOST_PORT:-19464}:9464"
      - "${ONTOAXIS_OTEL_INTERNAL_HOST_PORT:-18888}:8888"

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${ONTOAXIS_JAEGER_HOST_PORT:-16686}:16686"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../observability/prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro
      - ../observability/prometheus/rules_test.yaml:/etc/prometheus/rules_test.yaml:ro
      - ontoaxis_prometheus_data:/prometheus
    ports:
      - "${ONTOAXIS_PROMETHEUS_HOST_PORT:-19091}:9090"
    depends_on:
      - otel-collector

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
    volumes:
      - ../observability/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
    ports:
      - "${ONTOAXIS_ALERTMANAGER_HOST_PORT:-19093}:9093"

  perses:
    profiles: ["observability"]
    image: persesdev/perses:v0.50.0
    ports:
      - "${ONTOAXIS_PERSES_HOST_PORT:-18084}:8080"

volumes:
  ontoaxis_postgres_data:
  ontoaxis_prometheus_data:
  search_data:

networks:
  edge:
