# Trino Iceberg catalog —— 可选 Trino 读取路径（本地证据 profile，未端到端验证）
#
# 挂载位置（overlay compose.trino-iceberg.yaml）：
#   /etc/trino/catalog/iceberg.properties
#
# 前提：
#   1) 核心 compose 的 postgres 已创建 schema `iceberg_catalog`（ops 前置步骤，见 README）；
#   2) Trino 镜像的 iceberg 插件目录里有 PostgreSQL JDBC 驱动（overlay 会挂载
#      trino/plugins/postgresql-42.7.7.jar 到 /usr/lib/trino/plugin/iceberg/）；
#   3) 与 Kafka Connect 的 Iceberg JDBC catalog 使用同一 catalog 名称、同一 JDBC URL、
#      同一 warehouse 路径。
#
# 属性名依据（已核对，非猜测）：
#   - Trino 478 IcebergJdbcCatalogConfig：iceberg.jdbc-catalog.*（driver-class / connection-url /
#     connection-user / connection-password / catalog-name / default-warehouse-dir /
#     schema-version，见 trino/README.md 的引用）
#   - Trino 478 FileSystemConfig：fs.native-local.enabled；FileSystemModule 同时把
#     "local" 与 "file" scheme 绑定到 LocalFileSystemFactory，因此 Connect 写入的
#     file:///warehouse/... 元数据可以被 Trino 读取（root 挂载在 /warehouse）。

connector.name=iceberg

# ---- JDBC catalog（元数据表 reuse 核心 Postgres 的 iceberg_catalog schema） ----
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
# 注意：currentSchema 是让 Iceberg JdbcCatalog 的 iceberg_tables / iceberg_namespace_properties
# 落在 iceberg_catalog schema 的关键；schema 本身必须由 ops 预先创建。
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/ontoaxis?currentSchema=public
# 本地默认口令，仅用于本地证据环境，不得复用/提交到真实环境。
iceberg.jdbc-catalog.connection-user=ontoaxis
iceberg.jdbc-catalog.connection-password=ontoaxis
# 必须与 Kafka Connect 侧 connector 配置的 iceberg.catalog 名称一致（默认建议 ontoaxis）。
iceberg.jdbc-catalog.catalog-name=ontoaxis
# Iceberg 表数据目录：与 kafka-connect、Trino 共享同一命名卷，挂载点 /warehouse。
iceberg.jdbc-catalog.default-warehouse-dir=file:///warehouse
# 与 Iceberg JdbcCatalog 的 jdbc.schema-version 对齐（Trino 默认 V1）。
iceberg.jdbc-catalog.schema-version=V1

# ---- 本地文件系统访问 ----
# 默认关闭；打开后 "file" 与 "local" scheme 由 Trino 本地 FileSystem 处理。
# local.location 必须是根：Trino 的本地 FileIO 会把它作为前缀拼接 file: URI，
# 设成 /warehouse 时 file:/warehouse/... 会被解析成 /warehouse/warehouse/...，
# 导致 Connect 写入的 metadata 报 "Metadata not found in metadata location"。
fs.local.enabled=true
local.location=/