version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/klb3713/ontoaxis/gen
inputs:
  - directory: .
plugins:
  # Remote plugins are pinned so local development and CI do not require
  # manually installing protoc-gen-* binaries.
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v2.0.2
    out: ../gen
    opt: paths=source_relative
  - remote: buf.build/community/google-gnostic-openapi:v0.7.1
    out: ../openapi
  - remote: buf.build/bufbuild/es:v2.14.0
    out: ../web/src/generated
    opt: target=ts
