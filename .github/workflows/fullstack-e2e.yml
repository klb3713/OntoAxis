name: fullstack-e2e

# Stage 2 全栈 E2E（Compose，本地/合成数据）。
# 覆盖 stage-2-integration 7.1–7.4 的 Compose 部分：基础链路、数据链路
# （search/temporal/connector/pipeline）、身份与授权由 ci 的 edge/authz-integration
# job 提供。仅做隔离环境验证，不是生产验收。手动触发 + 本文件变更的 PR。
on:
  workflow_dispatch: {}
  # 允许在功能分支上跑首轮；该模式不匹配 main，合并后不影响主干触发策略。
  push:
    branches: ['stage2-int/**']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fullstack-e2e.yml'
      - 'scripts/object-search-e2e*.sh'
      - 'scripts/actions-temporal-smoke.sh'
      - 'scripts/connector-runtime-e2e.sh'
      - 'scripts/smoke-foundation.sh'

permissions:
  contents: read

jobs:
  # E2E-01（基础链路，core 部分）：/healthz、/readyz、/metrics、未知路由 404。
  e2e-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h /
      - name: Run foundation smoke
        run: bash scripts/smoke-foundation.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml -f deploy/compose/authz/compose.authz.yaml logs --tail=150

  # E2E-04：outbox → Meilisearch → 搜索/重建（脚本自管隔离栈）。
  e2e-search-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h /
      - name: Run object-search e2e
        env:
          E2E_START_TIMEOUT: "300"
        run: bash scripts/object-search-e2e.sh

  # E2E-07：Temporal 重试/补偿/审批（脚本自起并清理栈）。
  e2e-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h /
      - name: Run actions smoke
        run: bash scripts/actions-temporal-smoke.sh

  # E2E-05：CDC 负向矩阵（成功同步需更长提交窗口，默认不跑）。
  e2e-connector:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h /
      - name: Start connector + core stack
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/authz/compose.authz.yaml \
            -f deploy/connector-runtime/compose.connector-runtime.yaml \
            --profile connector-runtime up -d --build postgres keycloak openfga authz-init ontoaxis-core trino redpanda source-postgres kafka-connect
      - name: Wait for core and kafka-connect REST
        run: |
          for _ in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:18080/readyz >/dev/null 2>&1 && \
               curl -fsS http://127.0.0.1:18089/connectors >/dev/null 2>&1; then
              exit 0
            fi
            sleep 4
          done
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/authz/compose.authz.yaml \
            -f deploy/connector-runtime/compose.connector-runtime.yaml \
            --profile connector-runtime ps
          exit 1
      - name: Run connector CDC negative matrix
        run: bash scripts/connector-runtime-e2e.sh
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/authz/compose.authz.yaml \
            -f deploy/connector-runtime/compose.connector-runtime.yaml \
            --profile connector-runtime logs --tail=150
      - name: Tear down
        if: always()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/authz/compose.authz.yaml \
            -f deploy/connector-runtime/compose.connector-runtime.yaml \
            --profile connector-runtime down -v

  # E2E-06（部分）：Kestra + Trino 可执行面验证（Flow 发布/dataset 产出仍待补）。
  e2e-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KESTRA_BASIC_AUTH_USERNAME: admin
      KESTRA_BASIC_AUTH_PASSWORD: admin123
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h /
      - name: Start pipeline stack
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/pipeline-kestra/compose.pipeline.yaml up -d --build postgres trino kestra
      - name: Wait for kestra and trino
        run: |
          for _ in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18086/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ] && \
               curl -fsS http://127.0.0.1:18081/v1/info >/dev/null 2>&1; then
              echo "kestra http=$code"; exit 0
            fi
            sleep 4
          done
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/pipeline-kestra/compose.pipeline.yaml ps
          exit 1
      - name: Assert kestra API and trino respond
        run: |
          curl -fsS http://127.0.0.1:18086/health
          curl -fsS -u "$KESTRA_BASIC_AUTH_USERNAME:$KESTRA_BASIC_AUTH_PASSWORD" \
            http://127.0.0.1:18086/api/v1/configs >/dev/null
          curl -fsS http://127.0.0.1:18081/v1/info
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/pipeline-kestra/compose.pipeline.yaml logs --tail=120
      - name: Tear down
        if: always()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/pipeline-kestra/compose.pipeline.yaml down -v
