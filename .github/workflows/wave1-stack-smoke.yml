name: wave1-stack-smoke

# Wave 1 服务分组启动矩阵（G2 条件 5「所有 Wave 1 服务的 compose 配置可启动」的证据）。
# 只做本地/合成数据验证，不是生产部署验收。手动触发。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  connector-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start connector-runtime stack
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/connector-runtime/compose.connector-runtime.yaml \
            --profile connector-runtime up -d --build
      - name: Wait for connect and core
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18089/ >/dev/null 2>&1 && \
               curl -fsS http://127.0.0.1:18080/readyz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/connector-runtime/compose.connector-runtime.yaml \
            --profile connector-runtime ps
          exit 1
      - name: Verify connector runtime
        run: ./deploy/connector-runtime/scripts/verify-connector-runtime.sh
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/connector-runtime/compose.connector-runtime.yaml \
            --profile connector-runtime logs --tail=120
      - name: Tear down
        if: always()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/connector-runtime/compose.connector-runtime.yaml \
            --profile connector-runtime down -v

  pipeline-kestra:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KESTRA_BASIC_AUTH_USERNAME: admin
      KESTRA_BASIC_AUTH_PASSWORD: admin123
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start pipeline stack
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/pipeline-kestra/compose.pipeline.yaml up -d --build
      - name: Wait for kestra, trino and core
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS -u "$KESTRA_BASIC_AUTH_USERNAME:$KESTRA_BASIC_AUTH_PASSWORD" \
                 http://127.0.0.1:18086/api/v1/configs >/dev/null 2>&1 && \
               curl -fsS http://127.0.0.1:18081/v1/info >/dev/null 2>&1 && \
               curl -fsS http://127.0.0.1:18080/readyz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/pipeline-kestra/compose.pipeline.yaml ps
          exit 1
      - name: Assert kestra config and trino info
        run: |
          curl -fsS -u "$KESTRA_BASIC_AUTH_USERNAME:$KESTRA_BASIC_AUTH_PASSWORD" \
            http://127.0.0.1:18086/api/v1/configs | head -c 400
          echo
          curl -fsS http://127.0.0.1:18081/v1/info
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/pipeline-kestra/compose.pipeline.yaml logs --tail=120
      - name: Tear down
        if: always()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/pipeline-kestra/compose.pipeline.yaml down -v

  action-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start stack and run actions smoke
        run: bash scripts/actions-temporal-smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/authz/compose.authz.yaml \
            -f deploy/compose/action-temporal/compose.temporal.yaml logs --tail=150
      - name: Tear down
        if: always()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/authz/compose.authz.yaml \
            -f deploy/compose/action-temporal/compose.temporal.yaml down -v
