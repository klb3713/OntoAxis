name: wave1-stack-smoke

# Wave 1 服务分组启动矩阵（G2 条件 5「所有 Wave 1 服务的 compose 配置可启动」的证据）。
# 只做本地/合成数据验证，不是生产部署验收。手动触发。
on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wave1-stack-smoke.yml'

permissions:
  contents: read

jobs:
  connector-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h /
      - name: Start connector-runtime stack
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/connector-runtime/compose.connector-runtime.yaml \
            --profile connector-runtime up -d --build postgres trino redpanda source-postgres kafka-connect
      - name: Wait for kafka-connect REST
        run: |
          for _ in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:18089/connectors >/dev/null 2>&1; then
              exit 0
            fi
            sleep 4
          done
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/connector-runtime/compose.connector-runtime.yaml \
            --profile connector-runtime ps
          exit 1
      - name: Verify connector runtime
        run: ./deploy/connector-runtime/scripts/verify-connector-runtime.sh
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/connector-runtime/compose.connector-runtime.yaml \
            --profile connector-runtime logs --tail=120
      - name: Tear down
        if: always()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/connector-runtime/compose.connector-runtime.yaml \
            --profile connector-runtime down -v

  pipeline-kestra:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KESTRA_BASIC_AUTH_USERNAME: admin@ontoaxis.local
      KESTRA_BASIC_AUTH_PASSWORD: Admin1234
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h /
      - name: Start pipeline stack
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/pipeline-kestra/compose.pipeline.yaml up -d --build postgres trino kestra
      - name: Wait for kestra HTTP and trino
        run: |
          for _ in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18086/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ] && \
               curl -fsS http://127.0.0.1:18081/v1/info >/dev/null 2>&1; then
              echo "kestra http=$code"; exit 0
            fi
            sleep 4
          done
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/pipeline-kestra/compose.pipeline.yaml ps
          exit 1
      - name: Assert kestra and trino respond
        run: |
          curl -s -o /dev/null -w 'kestra %{http_code}\n' http://127.0.0.1:18086/
          curl -fsS http://127.0.0.1:18081/v1/info
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/pipeline-kestra/compose.pipeline.yaml logs --tail=120
      - name: Tear down
        if: always()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/pipeline-kestra/compose.pipeline.yaml down -v

  action-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h /
      - name: Start action-temporal stack
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/authz/compose.authz.yaml \
            -f deploy/compose/action-temporal/compose.temporal.yaml up -d --build
      - name: Wait for core and keycloak
        run: |
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18080/readyz >/dev/null 2>&1 && \
               curl -fsS -X POST http://127.0.0.1:18083/realms/ontoaxis/protocol/openid-connect/token \
                 -H 'Content-Type: application/x-www-form-urlencoded' \
                 -d 'grant_type=password&client_id=ontoaxis-web&username=admin&password=admin123' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/authz/compose.authz.yaml \
            -f deploy/compose/action-temporal/compose.temporal.yaml ps
          exit 1
      - name: Run actions smoke
        env:
          SKIP_START: "1"
        run: bash scripts/actions-temporal-smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/authz/compose.authz.yaml \
            -f deploy/compose/action-temporal/compose.temporal.yaml logs --tail=150
      - name: Tear down
        if: always()
        run: |
          docker compose -f deploy/compose/compose.yaml \
            -f deploy/compose/authz/compose.authz.yaml \
            -f deploy/compose/action-temporal/compose.temporal.yaml down -v
