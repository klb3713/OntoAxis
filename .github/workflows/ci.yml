name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: docker run --rm -v "$PWD":/src -w /src golangci/golangci-lint:v2.15.0 golangci-lint run ./...
      - name: Edge route generation check
        run: make edge-generate-check
      - name: License
        run: make license-check

  authz-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: true
      - name: Authz real OpenFGA integration
        run: go test -tags=integration -run 'TestAuthorizerWithRealOpenFGA|TestDatasetHandlerWithRealOpenFGA' -v ./internal/platform/authz/ ./internal/modules/datasets/api/

  # Object search integration: real PostgreSQL schema/migrations, real
  # Meilisearch task semantics, rebuild/swap/replay/verify paths. The tests are
  # build-tagged `integration` and skip when ONTOAXIS_SEARCH_TEST_* is absent,
  # so CI sets ONTOAXIS_SEARCH_TEST_REQUIRED=1 to make a missing service fatal.
  search-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ontoaxis
          POSTGRES_PASSWORD: ontoaxis
          POSTGRES_DB: ontoaxis
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ontoaxis -d ontoaxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_MASTER_KEY: ontoaxis-ci-search-master-key
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 17701:7700
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: true
      - name: Object search real PostgreSQL + Meilisearch integration
        env:
          ONTOAXIS_SEARCH_TEST_REQUIRED: "1"
          ONTOAXIS_SEARCH_TEST_DATABASE_URL: postgres://ontoaxis:ontoaxis@127.0.0.1:55432/ontoaxis?sslmode=disable
          ONTOAXIS_SEARCH_TEST_MEILISEARCH_URL: http://127.0.0.1:17701
          ONTOAXIS_SEARCH_TEST_API_KEY: ontoaxis-ci-search-master-key
        run: go test -tags=integration -count=1 -p 1 -timeout 15m -v ./internal/platform/search/
      - name: Object search retrieval regression gate (synthetic fixture)
        env:
          MEILI_URL: http://127.0.0.1:17701
          MEILI_API_KEY: ontoaxis-ci-search-master-key
        run: bash scripts/search-quality-baseline.sh --strict

  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks-action 通过 REST 列出 PR commits；默认 GITHUB_TOKEN 只有
    # contents:read，访问 /pulls/{n}/commits 会 403（Resource not accessible by integration）。
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Ensure main baseline ref for buf breaking
        # PR 分支的 checkout 只有合并提交，没有本地 main 分支；buf breaking
        # 需要 `branch=main` 基线，因此显式把远端 main 取成本地分支。
        run: git fetch --no-tags origin +refs/heads/main:refs/heads/main
      - name: Lint
        run: cd proto && buf lint
      - name: Generate drift check
        run: make generate-check
      - name: Breaking
        run: make proto-breaking

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Frontend checks (skip until web/package.json exists)
        run: |
          if [ -f web/package.json ]; then
            cd web && pnpm install --frozen-lockfile && pnpm check && pnpm build && pnpm test
          else
            echo "web/package.json not present yet; skipping frontend checks"
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build core image
        run: docker build -t ontoaxis-core:ci .
      - name: Build web image
        run: docker build -f web/Dockerfile -t ontoaxis-web:ci .

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rules test
        run: make observability-rules-test
      - name: Start observability stack and assert metrics/traces
        env:
          ONTOAXIS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
        run: scripts/observability-smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml --profile observability logs --tail=120
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/compose.yaml --profile observability down -v

  compose-smoke:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start core loop
        run: docker compose -f deploy/compose/compose.yaml up -d postgres ontoaxis-core
      - name: Wait for readiness
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose/compose.yaml logs ontoaxis-core
          exit 1
      - name: Smoke
        run: |
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/readyz
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start edge stack
        run: docker compose -f deploy/compose/compose.yaml -f deploy/compose/authz/compose.authz.yaml --profile edge up -d --build postgres keycloak openfga authz-init ontoaxis-core ontoaxis-core-edge oa-edge
      - name: Wait for edge and Keycloak
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18085/healthz >/dev/null && \
               curl -fsS -X POST http://127.0.0.1:18083/realms/ontoaxis/protocol/openid-connect/token \
                 -H 'Content-Type: application/x-www-form-urlencoded' \
                 -d 'grant_type=password&client_id=ontoaxis-web&username=admin&password=admin123' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose/compose.yaml -f deploy/compose/authz/compose.authz.yaml --profile edge logs --tail=120
          exit 1
      - name: Edge smoke (positive/negative/fail-closed)
        run: EDGE_TEST_FAIL_CLOSED=1 scripts/edge-smoke.sh
      - name: Edge manifest structural check
        run: deploy/edge/kind/verify.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml -f deploy/compose/authz/compose.authz.yaml --profile edge logs --tail=150
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/compose.yaml -f deploy/compose/authz/compose.authz.yaml --profile edge down -v

  # Static delivery gate: chart rendering, schema validation, shell/action lint and
  # config drift. No cluster required; runs on every push/PR.
  delivery-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install delivery tools
        run: |
          tmp=$(mktemp -d)
          curl -fsSLo "$tmp/helm.tgz" https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz
          tar -xzf "$tmp/helm.tgz" -C "$tmp"
          sudo install -m 0755 "$tmp/linux-amd64/helm" /usr/local/bin/helm
          curl -fsSLo "$tmp/kubeconform.tgz" https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf "$tmp/kubeconform.tgz" -C "$tmp" kubeconform
          sudo install -m 0755 "$tmp/kubeconform" /usr/local/bin/kubeconform
          curl -fsSLo "$tmp/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf "$tmp/actionlint.tgz" -C "$tmp" actionlint
          sudo install -m 0755 "$tmp/actionlint" /usr/local/bin/actionlint
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          /usr/bin/python3 -c 'import yaml'
      - name: Helm lint, deterministic render and schema matrix
        run: PATH="/usr/bin:$PATH" bash scripts/delivery-render-check.sh --require-schema
      - name: Offline delivery regression tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/delivery-smoke-test.py
          bash scripts/delivery-release-flow-test.sh
          bash deploy/kind/render-gitops-root-test.sh
          bash deploy/kind/kind-up-test.sh
      - name: ShellCheck
        run: shellcheck scripts/delivery-*.sh deploy/kind/*.sh
      - name: actionlint
        run: actionlint -color
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Edge generation + delivery config drift
        run: make edge-generate-check delivery-config-check
